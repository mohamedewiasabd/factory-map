name: Android (APK + AAB)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Lint + Web build
        run: npm run lint && npm run build

      - name: Capacitor sync android
        run: npx cap sync android

      - name: Write release keystore + signing properties
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/factorymap-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=keystore/factorymap-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Assemble debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Assemble release APK + AAB
        run: cd android && ./gradlew assembleRelease bundleRelease

      - name: Verify release signature
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          "$ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/apksigner" verify \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: factory-map-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: factory-map-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: factory-map-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Generate SHA256 checksums
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/factory-map-1.0.0-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/factory-map-1.0.0-release.aab
          sha256sum release/*.apk release/*.aab > release/SHA256SUMS.txt
          cat release/SHA256SUMS.txt

      - name: Upload release folder
        uses: actions/upload-artifact@v4
        with:
          name: factory-map-release-folder
          path: release/
          if-no-files-found: warn