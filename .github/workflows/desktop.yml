name: Desktop (Windows / Linux / macOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            targets: ""
          - platform: windows-latest
            args: ""
            targets: ""
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
            bundles: app
          - platform: macos-26
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
            bundles: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install Linux system dependencies (webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Lint + Web build
        run: npm run lint && npm run build

      - name: Build Tauri bundle
        shell: bash
        run: |
          ARGS="${{ matrix.args }}"
          BUNDLES="${{ matrix.bundles }}"
          if [ -n "$BUNDLES" ]; then
            CMD="npm run tauri -- build $ARGS --bundles $BUNDLES"
          elif [ -n "$ARGS" ]; then
            CMD="npm run tauri -- build $ARGS"
          else
            CMD="npm run tauri -- build"
          fi
          for attempt in 1 2 3; do
            echo "Attempt $attempt: $CMD"
            if eval "$CMD"; then
              echo "build succeeded"
              exit 0
            fi
            echo "build failed (attempt $attempt)"
            sleep 30
          done
          echo "build failed after 3 attempts"
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: factory-map-desktop-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/**
            !**/*.map
          if-no-files-found: warn