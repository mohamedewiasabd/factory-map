[package]
name = "factory-map"
version = "1.0.0"
description = "خريطة المصانع المصرية — Egypt Factory Map"
authors = ["Mohamed Ewias Abd"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true