<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="6" />
  
  <!-- Factory Icon Graphic -->
  <g transform="translate(64, 76)">
    <!-- Base Factory Structure -->
    <path d="M48 336 L336 336 L336 120 L240 192 L240 120 L144 192 L144 120 L48 192 Z" fill="url(#amber)" />
    <!-- Smokestacks / Chimneys -->
    <rect x="68" y="48" width="36" height="72" rx="6" fill="#f59e0b" />
    <rect x="164" y="48" width="36" height="72" rx="6" fill="#f59e0b" />
    <!-- Factory Windows -->
    <rect x="76" y="240" width="32" height="48" rx="6" fill="#0f172a" />
    <rect x="136" y="240" width="32" height="48" rx="6" fill="#0f172a" />
    <rect x="196" y="240" width="32" height="48" rx="6" fill="#0f172a" />
    <rect x="256" y="240" width="32" height="48" rx="6" fill="#0f172a" />
    
    <!-- GPS Pin Accent -->
    <circle cx="280" cy="80" r="32" fill="#ef4444" />
    <circle cx="280" cy="80" r="14" fill="#ffffff" />
    <path d="M280 110 L280 135" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
